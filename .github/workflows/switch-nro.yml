name: RIKITU native Switch NRO smoke
on:
  pull_request:
    paths:
      - 'switch/**'
      - 'tests/check_nro.py'
      - 'tests/test-nro-checker.py'
      - 'native/rikitu_rules.*'
      - 'native/rikitu_loop.*'
      - '.github/workflows/switch-nro.yml'
  push:
    branches: [main]
    paths:
      - 'switch/**'
      - 'native/rikitu_rules.*'
      - 'native/rikitu_loop.*'
      - '.github/workflows/switch-nro.yml'
  workflow_dispatch:

# Keep only the most recent revision of each PR; push builds apply to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-nro:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
      - name: Confirm toolchain
        run: |
          test -f "$DEVKITPRO/libnx/switch_rules"
          test -x "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-gcc"
          echo "$DEVKITPRO/devkitA64/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/tools/bin" >> "$GITHUB_PATH"
      - name: Compile minimal RIKITU native probe
        run: make -C switch -j2
      - name: Verify NRO artifact
        run: |
          test -s switch/rikitu_native_probe.nro
          python3 tests/check_nro.py switch/rikitu_native_probe.nro
          ls -lh switch/rikitu_native_probe.nro
      # Build is verified in place; no public NRO artifact is required.
