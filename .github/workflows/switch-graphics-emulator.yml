name: RIKITU NeXium graphical runtime QA
on:
  pull_request:
    paths:
      - '.github/workflows/switch-graphics-emulator.yml'
      - 'tests/run_nexium_graphical.sh'
      - 'tests/run_nexium_retry_display.sh'
      - 'native/rikitu_combat_guest_qa.*'
      - 'native/test_combat_guest_qa.c'
      - 'tests/check_combat_guest.py'
      - 'tests/check_emulator_scene.py'
      - 'tests/check_save_guest.py'
      - 'tests/check_campaign_guest.py'
      - 'tests/check_torn_guest_slots.py'
      - 'tests/check_reverse_guest_slots.py'
      - 'tests/check_wrap_guest_slots.py'
      - 'tests/check_mismatched_guest_level.py'
      - 'tests/check_emulator_map_cycle.py'
      - 'switch_graphical/**'
      - 'native/rikitu_draw.*'
      - 'native/rikitu_demo.*'
      - 'native/rikitu_workshop_guest_qa.*'
      - 'native/test_workshop_guest_qa.c'
      - 'native/rikitu_delivery_guest_qa.*'
      - 'native/test_delivery_guest_qa.c'
  push:
    branches: [main]
    paths:
      - '.github/workflows/switch-graphics-emulator.yml'
      - 'tests/run_nexium_graphical.sh'
      - 'tests/run_nexium_retry_display.sh'
      - 'native/rikitu_combat_guest_qa.*'
      - 'native/test_combat_guest_qa.c'
      - 'tests/check_combat_guest.py'
      - 'tests/check_emulator_scene.py'
      - 'tests/check_save_guest.py'
      - 'tests/check_campaign_guest.py'
      - 'tests/check_torn_guest_slots.py'
      - 'tests/check_reverse_guest_slots.py'
      - 'tests/check_wrap_guest_slots.py'
      - 'tests/check_mismatched_guest_level.py'
      - 'tests/check_emulator_map_cycle.py'
      - 'switch_graphical/**'
      - 'native/rikitu_draw.*'
      - 'native/rikitu_demo.*'
      - 'native/rikitu_workshop_guest_qa.*'
      - 'native/test_workshop_guest_qa.c'
      - 'native/rikitu_delivery_guest_qa.*'
      - 'native/test_delivery_guest_qa.c'
  workflow_dispatch:
# Keep only the most recent revision of each PR; push builds apply to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
      - name: Record exact devkitPro and libnx inputs
        shell: bash
        run: |
          set -euo pipefail
          printf 'DEVKITPRO=%s\n' "$DEVKITPRO"
          dkp-pacman -Q libnx switch-dev devkitA64 devkitARM
          test -f "$DEVKITPRO/libnx/include/switch/runtime/devices/fs_dev.h"
          test -f "$DEVKITPRO/libnx/include/switch/services/fs.h"
          libnx_archive="$(find "$DEVKITPRO" -type f -name libnx.a -print -quit)"
          test -n "$libnx_archive"
          sha256sum \
            "$DEVKITPRO/libnx/include/switch/runtime/devices/fs_dev.h" \
            "$DEVKITPRO/libnx/include/switch/services/fs.h" \
            "$libnx_archive"

      - name: Configure toolchain and build
        run: |
          echo "$DEVKITPRO/devkitA64/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/tools/bin" >> "$GITHUB_PATH"
          PATH="$DEVKITPRO/devkitA64/bin:$DEVKITPRO/tools/bin:$PATH" make -C switch_graphical -j2
          python3 tests/check_nro.py switch_graphical/rikitu_scene_probe.nro
      - name: Build guest-only C99 combat QA NRO
        run: |
          PATH="$DEVKITPRO/devkitA64/bin:$DEVKITPRO/tools/bin:$PATH" make -C switch_graphical QA_MODE=1 -j2
          python3 tests/check_nro.py switch_graphical/rikitu_combat_qa_probe.nro
      - name: Build dedicated SDMC save cold-restart NRO
        run: |
          PATH="$DEVKITPRO/devkitA64/bin:$DEVKITPRO/tools/bin:$PATH" make -C switch_graphical QA_MODE=2 -j2
          python3 tests/check_nro.py switch_graphical/rikitu_save_qa_probe.nro
      - name: Build independent RKC2/RKL3 guest QA NRO
        run: |
          PATH="$DEVKITPRO/devkitA64/bin:$DEVKITPRO/tools/bin:$PATH" make -C switch_graphical QA_MODE=4 -j2
          python3 tests/check_nro.py switch_graphical/rikitu_campaign_qa_probe.nro
      - name: Upload campaign and level cold-restart NRO
        uses: actions/upload-artifact@v4
        with:
          name: rikitu-nexium-campaign-qa-nro
          path: switch_graphical/rikitu_campaign_qa_probe.nro
          if-no-files-found: error
      - name: Upload dedicated SDMC save QA NRO
        uses: actions/upload-artifact@v4
        with:
          name: rikitu-nexium-save-qa-nro
          path: switch_graphical/rikitu_save_qa_probe.nro
          if-no-files-found: error
      - name: Upload guest combat QA NRO
        uses: actions/upload-artifact@v4
        with:
          name: rikitu-nexium-combat-qa-nro
          path: switch_graphical/rikitu_combat_qa_probe.nro
          if-no-files-found: error
      - name: Upload graphical NRO
        uses: actions/upload-artifact@v4
        with:
          name: rikitu-nexium-qa-input-nro
          path: switch_graphical/rikitu_scene_probe.nro
          if-no-files-found: error
  emulated-graphics:
    needs: compile
    runs-on: ubuntu-26.04
    # The full multi-boot suite exceeded 20 minutes on the PR runner;
    # allow time for dependency setup plus all guest recovery checks.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rikitu-nexium-qa-input-nro
          path: nro
      - uses: actions/download-artifact@v4
        with:
          name: rikitu-nexium-combat-qa-nro
          path: nro-combat
      - uses: actions/download-artifact@v4
        with:
          name: rikitu-nexium-save-qa-nro
          path: nro-save
      - uses: actions/download-artifact@v4
        with:
          name: rikitu-nexium-campaign-qa-nro
          path: nro-campaign
      - name: Install headless NeXium dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "Updating package indexes (hard limit: 5 minutes)"
          sudo timeout --kill-after=30s 300s apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=45 \
            -o Acquire::https::Timeout=45 \
            update
          echo "Installing NeXium runtime dependencies (hard limit: 15 minutes; no recommended packages)"
          sudo timeout --kill-after=30s 900s apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=45 \
            -o Acquire::https::Timeout=45 \
            -o DPkg::Lock::Timeout=60 \
            install -y --no-install-recommends curl jq xvfb xauth xdotool imagemagick python3-pil \
              libgtk-3-0t64 libasound2t64 libudev1 libxkbcommon0 \
              libxkbcommon-x11-0 libx11-xcb1 libxcb-cursor0 \
              libxcb-xinerama0 libxcb-xfixes0 libxcb-randr0 \
              libxcb-render0 libxcb-shape0 libxcb-xkb1 \
              libvulkan1 mesa-vulkan-drivers
      - name: Download NeXium nightly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          json="$(curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/nexium-emu/nexium-nightly/releases/tags/nightly)"
          url="$(printf '%s' "$json" | jq -r '.assets[] | select(.name == "nexium-linux-x86_64.tar.gz") | .browser_download_url')"
          test -n "$url"
          curl -fL --retry 3 "$url" -o /tmp/nexium.tar.gz
          mkdir -p /tmp/nexium
          tar -xzf /tmp/nexium.tar.gz -C /tmp/nexium
          bin="$(find /tmp/nexium -type f -executable \( -name 'nexium-gui' -o -name 'nexium' \) -print -quit)"
          test -n "$bin"
          echo "NEXIUM_BIN=$bin" >> "$GITHUB_ENV"
      - name: Run guest, capture screenshots and verify controller movement
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export NRO_PATH="$GITHUB_WORKSPACE/nro/rikitu_scene_probe.nro"
          export RIKITU_MAP_CYCLE_QA=1
          export OUTPUT_DIR="$GITHUB_WORKSPACE/evidence"
          mkdir -p "$OUTPUT_DIR"
          mkdir -p /tmp/rikitu-xdg-runtime
          chmod 700 /tmp/rikitu-xdg-runtime
          export XDG_RUNTIME_DIR=/tmp/rikitu-xdg-runtime
          timeout --kill-after=5s 110s xvfb-run -a -s '-screen 0 1280x720x24' \
            bash tests/run_nexium_graphical.sh
      - name: Run 24 real Switch-side MAP01-MAP06 gameplay checks
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export NRO_PATH="$GITHUB_WORKSPACE/nro-combat/rikitu_combat_qa_probe.nro"
          export OUTPUT_DIR="$GITHUB_WORKSPACE/evidence/combat"
          export RIKITU_QA_MODE=1
          mkdir -p /tmp/rikitu-xdg-runtime "$OUTPUT_DIR"
          chmod 700 /tmp/rikitu-xdg-runtime
          export XDG_RUNTIME_DIR=/tmp/rikitu-xdg-runtime
          # A new Xvfb server can sporadically fail to accept Winit's first
          # XOpenDisplay request on the runner. Retry exactly once *only*
          # for that display-startup error, never for a game assertion.
          set +e
          timeout --kill-after=5s 110s xvfb-run -a -s '-screen 0 1280x720x24' \
            bash tests/run_nexium_graphical.sh > "$OUTPUT_DIR/display-attempt-1.log" 2>&1
          status=$?
          set -e
          cat "$OUTPUT_DIR/display-attempt-1.log"
          if [ "$status" -ne 0 ]; then
            if ! grep -Fq 'XOpenDisplayFailed' "$OUTPUT_DIR/display-attempt-1.log"; then
              exit "$status"
            fi
            echo "Transient Xvfb/Winit display startup failure; retrying guest once"
            sleep 3
            timeout --kill-after=5s 110s xvfb-run -a -s '-screen 0 1280x720x24' \
              bash tests/run_nexium_graphical.sh
          fi
      - name: Verify SDMC saves through three independent guest launches
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export NRO_PATH="$GITHUB_WORKSPACE/nro-save/rikitu_save_qa_probe.nro"
          export NEXIUM_DATA_ROOT="$GITHUB_WORKSPACE/evidence/save-root"
          export RIKITU_QA_MODE=3
          mkdir -p "$NEXIUM_DATA_ROOT/sdmc" /tmp/rikitu-xdg-runtime
          chmod 700 /tmp/rikitu-xdg-runtime
          export XDG_RUNTIME_DIR=/tmp/rikitu-xdg-runtime
          for phase in seed resume verify; do
            export RIKITU_QA_PHASE="$phase"
            export OUTPUT_DIR="$GITHUB_WORKSPACE/evidence/sd-$phase"
            timeout --kill-after=5s 110s xvfb-run -a -s '-screen 0 1280x720x24' \
              bash tests/run_nexium_graphical.sh
          done
      - name: Verify RKC2/RKL3 over three independent NeXium guest launches
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export NRO_PATH="$GITHUB_WORKSPACE/nro-campaign/rikitu_campaign_qa_probe.nro"
          export NEXIUM_DATA_ROOT="$GITHUB_WORKSPACE/evidence/campaign-save-root"
          export RIKITU_QA_MODE=4
          mkdir -p "$NEXIUM_DATA_ROOT/sdmc" /tmp/rikitu-xdg-runtime
          chmod 700 /tmp/rikitu-xdg-runtime
          export XDG_RUNTIME_DIR=/tmp/rikitu-xdg-runtime
          for phase in seed resume verify; do
            export RIKITU_QA_PHASE="$phase"
            export OUTPUT_DIR="$GITHUB_WORKSPACE/evidence/campaign-$phase"
            timeout --kill-after=5s 110s xvfb-run -a -s '-screen 0 1280x720x24' \
              bash tests/run_nexium_graphical.sh
          done
      - name: Test torn and corrupt RKS1/RKC2/RKL3 guest saves with fallback
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          mkdir -p /tmp/rikitu-xdg-runtime
          chmod 700 /tmp/rikitu-xdg-runtime
          export XDG_RUNTIME_DIR=/tmp/rikitu-xdg-runtime
          for family in rks1 campaign; do
            if [[ "$family" == "rks1" ]]; then
              export NRO_PATH="$GITHUB_WORKSPACE/nro-save/rikitu_save_qa_probe.nro"
              export RIKITU_QA_MODE=3
            else
              export NRO_PATH="$GITHUB_WORKSPACE/nro-campaign/rikitu_campaign_qa_probe.nro"
              export RIKITU_QA_MODE=4
            fi
            export NEXIUM_DATA_ROOT="$GITHUB_WORKSPACE/evidence/stage97-$family-root"
            mkdir -p "$NEXIUM_DATA_ROOT/sdmc"
            for phase in seed resume; do
              export RIKITU_QA_PHASE="$phase"
              export OUTPUT_DIR="$GITHUB_WORKSPACE/evidence/stage97-$family-$phase"
              timeout --kill-after=5s 110s xvfb-run -a -s '-screen 0 1280x720x24' \
                bash tests/run_nexium_graphical.sh
            done
            # The host now simulates a torn newest B; older A is intact.
            python3 tests/check_torn_guest_slots.py inject "$NEXIUM_DATA_ROOT" "$family"
            # Third *independent guest*: RKS1 or RKC2+RKL3 must choose A,
            # confirm exact old state, and rebuild B (generation 2).
            export RIKITU_QA_PHASE=resume
            export OUTPUT_DIR="$GITHUB_WORKSPACE/evidence/stage97-$family-repair"
            timeout --kill-after=5s 110s xvfb-run -a -s '-screen 0 1280x720x24' \
              bash tests/run_nexium_graphical.sh
            python3 tests/check_torn_guest_slots.py check "$NEXIUM_DATA_ROOT" "$family"
            # Fourth independent guest: newest B is now restored.
            export RIKITU_QA_PHASE=verify
            export OUTPUT_DIR="$GITHUB_WORKSPACE/evidence/stage97-$family-verify"
            timeout --kill-after=5s 110s xvfb-run -a -s '-screen 0 1280x720x24' \
              bash tests/run_nexium_graphical.sh
          done
      - name: Test reverse-slot RKS1/RKC2/RKL3 guest recovery from damaged newest A
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          mkdir -p /tmp/rikitu-xdg-runtime
          chmod 700 /tmp/rikitu-xdg-runtime
          export XDG_RUNTIME_DIR=/tmp/rikitu-xdg-runtime
          for family in rks1 campaign; do
            if [[ "$family" == "rks1" ]]; then
              export NRO_PATH="$GITHUB_WORKSPACE/nro-save/rikitu_save_qa_probe.nro"
              export RIKITU_QA_MODE=3
            else
              export NRO_PATH="$GITHUB_WORKSPACE/nro-campaign/rikitu_campaign_qa_probe.nro"
              export RIKITU_QA_MODE=4
            fi
            export NEXIUM_DATA_ROOT="$GITHUB_WORKSPACE/evidence/stage98-$family-root"
            mkdir -p "$NEXIUM_DATA_ROOT/sdmc"
            for phase in seed resume; do
              export RIKITU_QA_PHASE="$phase"
              export OUTPUT_DIR="$GITHUB_WORKSPACE/evidence/stage98-$family-$phase"
              timeout --kill-after=5s 110s xvfb-run -a -s '-screen 0 1280x720x24' \
                bash tests/run_nexium_graphical.sh
            done
            # The host swaps valid slots (A gen2/B gen1) and damages only newest A.
            python3 tests/check_reverse_guest_slots.py inject "$NEXIUM_DATA_ROOT" "$family"
            # Third *independent guest*: read intact B gen1,
            # confirm previous state, then repair A as generation 2.
            export RIKITU_QA_PHASE=resume
            export OUTPUT_DIR="$GITHUB_WORKSPACE/evidence/stage98-$family-repair"
            timeout --kill-after=5s 110s xvfb-run -a -s '-screen 0 1280x720x24' \
              bash tests/run_nexium_graphical.sh
            python3 tests/check_reverse_guest_slots.py check "$NEXIUM_DATA_ROOT" "$family"
            # Fourth independent guest: newest A is now restored.
            export RIKITU_QA_PHASE=verify
            export OUTPUT_DIR="$GITHUB_WORKSPACE/evidence/stage98-$family-verify"
            timeout --kill-after=5s 110s xvfb-run -a -s '-screen 0 1280x720x24' \
              bash tests/run_nexium_graphical.sh
          done
      - name: Test SDMC uint32 generation wrap in both slot orientations in NeXium
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          mkdir -p /tmp/rikitu-xdg-runtime
          chmod 700 /tmp/rikitu-xdg-runtime
          export XDG_RUNTIME_DIR=/tmp/rikitu-xdg-runtime
          # Keep default save guest validation unchanged for all previous stages.
          # Only these runs use the dedicated wraparound CRC/generation auditor.
          export RIKITU_QA_WRAP=1
          for family in rks1 campaign; do
            if [[ "$family" == "rks1" ]]; then
              export NRO_PATH="$GITHUB_WORKSPACE/nro-save/rikitu_save_qa_probe.nro"
              export RIKITU_QA_MODE=3
            else
              export NRO_PATH="$GITHUB_WORKSPACE/nro-campaign/rikitu_campaign_qa_probe.nro"
              export RIKITU_QA_MODE=4
            fi
            for older in a b; do
              export NEXIUM_DATA_ROOT="$GITHUB_WORKSPACE/evidence/stage99-$family-$older-root"
              mkdir -p "$NEXIUM_DATA_ROOT/sdmc"
              export RIKITU_QA_PHASE=seed
              export OUTPUT_DIR="$GITHUB_WORKSPACE/evidence/stage99-$family-$older-seed"
              bash tests/run_nexium_retry_display.sh
              # Artificially advance a valid first-generation record to max
              # uint32 without modifying gameplay bytes, then recompute CRC.
              # For older=B, move the original guest-written A record to B.
              python3 tests/check_wrap_guest_slots.py prepare "$NEXIUM_DATA_ROOT" "$family" "$older"
              export RIKITU_QA_PHASE=resume
              export OUTPUT_DIR="$GITHUB_WORKSPACE/evidence/stage99-$family-$older-resume"
              bash tests/run_nexium_retry_display.sh
              # Actual guest must have created the opposite slot/gen1 and
              # kept the old max-generation backup SHA256 intact.
              python3 tests/check_wrap_guest_slots.py audit "$NEXIUM_DATA_ROOT" "$family" "$older"
              export RIKITU_QA_PHASE=verify
              export OUTPUT_DIR="$GITHUB_WORKSPACE/evidence/stage99-$family-$older-verify"
              bash tests/run_nexium_retry_display.sh
              # Third guest must select new gen1 over UINT32_MAX and write
              # neither slot; fail on unexpected re-serialization.
              python3 tests/check_wrap_guest_slots.py verify "$NEXIUM_DATA_ROOT" "$family" "$older"
            done
          done
      - name: Stage101 reject CRC-valid foreign RKL3 chapter or wallet in actual guest
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export NRO_PATH="$GITHUB_WORKSPACE/nro-campaign/rikitu_campaign_qa_probe.nro"
          export RIKITU_QA_MODE=4
          mkdir -p /tmp/rikitu-xdg-runtime
          chmod 700 /tmp/rikitu-xdg-runtime
          export XDG_RUNTIME_DIR=/tmp/rikitu-xdg-runtime
          # Each independent test uses a private SD root, preventing previous
          # RKC2/RKL3 states and corruption from leaking into other scenarios.
          for fault in chapter wallet; do
            for newest in a b; do
              unset RIKITU_QA_WRAP || true
              export NEXIUM_DATA_ROOT="$GITHUB_WORKSPACE/evidence/stage101-$fault-$newest-root"
              mkdir -p "$NEXIUM_DATA_ROOT/sdmc"
              for phase in seed resume; do
                export RIKITU_QA_PHASE="$phase"
                export OUTPUT_DIR="$GITHUB_WORKSPACE/evidence/stage101-$fault-$newest-$phase"
                bash tests/run_nexium_retry_display.sh
              done
              # RKC2 A/gen1 and B/gen2 remain untouched. Only newest RKL3
              # is replaced by a fully checksummed but foreign level or wallet.
              python3 tests/check_mismatched_guest_level.py inject \
                "$NEXIUM_DATA_ROOT" "$fault" "$newest"
              # Previous save checkers intentionally only accept gens 1/2.
              # Frame-only mode keeps four real guest green markers while
              # the Stage101 auditor checks RKC2 gen3 and RKL3 repair bytes.
              export RIKITU_QA_WRAP=1
              export RIKITU_QA_PHASE=resume
              export OUTPUT_DIR="$GITHUB_WORKSPACE/evidence/stage101-$fault-$newest-repair"
              bash tests/run_nexium_retry_display.sh
              python3 tests/check_mismatched_guest_level.py audit \
                "$NEXIUM_DATA_ROOT" "$fault" "$newest"
              export RIKITU_QA_PHASE=verify
              export OUTPUT_DIR="$GITHUB_WORKSPACE/evidence/stage101-$fault-$newest-verify"
              bash tests/run_nexium_retry_display.sh
              python3 tests/check_mismatched_guest_level.py verify \
                "$NEXIUM_DATA_ROOT" "$fault" "$newest"
            done
          done
      - name: Upload runtime screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rikitu-nexium-guest-screenshots
          path: evidence/
          if-no-files-found: warn
