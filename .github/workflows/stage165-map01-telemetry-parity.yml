name: RIKITU Stage165 MAP01 route telemetry and pause parity
on:
  pull_request:
    paths:
      - '.github/workflows/stage165-map01-telemetry-parity.yml'
      - 'native/test_map01_route_telemetry.c'
      - 'native/rikitu_demo.*'
      - 'native/rikitu_flower.*'
      - 'native/rikitu_map01_telemetry.*'
      - 'docs/STAGE165_ROUTE_TELEMETRY_PARITY.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage165-map01-telemetry-parity.yml'
      - 'native/test_map01_route_telemetry.c'
      - 'native/rikitu_demo.*'
      - 'native/rikitu_flower.*'
      - 'native/rikitu_map01_telemetry.*'
      - 'docs/STAGE165_ROUTE_TELEMETRY_PARITY.md'
permissions:
  contents: read
jobs:
  route-telemetry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: GCC all MAP01 fragments, checkpoints and exit at 30 60 120Hz
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_enemies.c native/rikitu_boss.c native/rikitu_flower.c native/rikitu_map01_telemetry.c native/test_map01_route_telemetry.c -lm -o /tmp/rikitu-telemetry-gcc
          /tmp/rikitu-telemetry-gcc
      - name: Clang full native input MAP01
        run: |
          clang -std=c99 -O2 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_enemies.c native/rikitu_boss.c native/rikitu_flower.c native/rikitu_map01_telemetry.c native/test_map01_route_telemetry.c -lm -o /tmp/rikitu-telemetry-clang
          /tmp/rikitu-telemetry-clang
      - name: Sanitizers full native input MAP01
        run: |
          clang -std=c99 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_enemies.c native/rikitu_boss.c native/rikitu_flower.c native/rikitu_map01_telemetry.c native/test_map01_route_telemetry.c -lm -o /tmp/rikitu-telemetry-san
          /tmp/rikitu-telemetry-san
      # No CI artifacts, private screenshots, game saves or recorded play.
