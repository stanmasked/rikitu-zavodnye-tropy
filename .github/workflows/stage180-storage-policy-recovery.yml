name: RIKITU Stage180 Storage Policy Recovery
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tests/test_ci_artifact_policy.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tests/test_ci_artifact_policy.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run storage-policy audit through recovery workflow
        run: python3 tests/test_ci_artifact_policy.py
