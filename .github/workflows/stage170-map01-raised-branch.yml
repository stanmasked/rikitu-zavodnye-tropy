name: RIKITU Stage170 MAP01 optional raised branch and safe return
on:
  pull_request:
    paths:
      - '.github/workflows/stage170-map01-raised-branch.yml'
      - 'native/test_map01_raised_branch.c'
      - 'native/rikitu_demo.*'
      - 'native/rikitu_flower.*'
      - 'native/rikitu_flower_data.h'
      - 'native/rikitu_map01_telemetry.*'
      - 'docs/STAGE170_MAP01_RAISED_BRANCH.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage170-map01-raised-branch.yml'
      - 'native/test_map01_raised_branch.c'
      - 'native/rikitu_demo.*'
      - 'native/rikitu_flower.*'
      - 'native/rikitu_flower_data.h'
      - 'native/rikitu_map01_telemetry.*'
      - 'docs/STAGE170_MAP01_RAISED_BRANCH.md'
permissions:
  contents: read
jobs:
  raised-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: GCC raised branch, elevated pickups and safe return
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_enemies.c native/rikitu_boss.c native/rikitu_flower.c native/rikitu_map01_telemetry.c native/test_map01_raised_branch.c -lm -o /tmp/rikitu-raised-branch-gcc
          /tmp/rikitu-raised-branch-gcc
      - name: Clang raised branch, elevated pickups and safe return
        run: |
          clang -std=c99 -O2 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_enemies.c native/rikitu_boss.c native/rikitu_flower.c native/rikitu_map01_telemetry.c native/test_map01_raised_branch.c -lm -o /tmp/rikitu-raised-branch-clang
          /tmp/rikitu-raised-branch-clang
      - name: Clang ASan and UBSan
        run: |
          clang -std=c99 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_enemies.c native/rikitu_boss.c native/rikitu_flower.c native/rikitu_map01_telemetry.c native/test_map01_raised_branch.c -lm -o /tmp/rikitu-raised-branch-san
          /tmp/rikitu-raised-branch-san
      # No user play records, captures, game saves or artifact uploads.
