name: RIKITU graphical Switch scene
on:
  pull_request:
    paths:
      - 'native/rikitu_draw.*'
      - 'native/rikitu_demo.*'
      - 'native/rikitu_flower.*'
      - 'native/rikitu_flower_data.h'
      - 'native/rikitu_flower_enemies_data.h'
      - 'native/rikitu_enemies.*'
      - 'native/rikitu_boss.*'
      - 'native/rikitu_mill.*'
      - 'native/rikitu_grove.*'
      - 'native/rikitu_bridge.*'
      - 'native/rikitu_bridge_guest_qa.*'
      - 'native/test_bridge_guest_qa.c'
      - 'native/rikitu_bridge_data.h'
      - 'native/test_bridge.c'
      - 'tests/test-bridge-source.cjs'
      - 'native/rikitu_grove_data.h'
      - 'native/test_grove.c'
      - 'native/rikitu_grove_guest_qa.*'
      - 'native/test_grove_guest_qa.c'
      - 'tests/test-grove-source.cjs'
      - 'native/test_mill_guest_qa.c'
      - 'native/rikitu_mill_data.h'
      - 'native/test_mill.c'
      - 'tests/test-mill-source.cjs'
      - 'native/rikitu_save.*'
      - 'native/rikitu_save_io.c'
      - 'native/test_save.c'
      - 'native/rikitu_combat_guest_qa.*'
      - 'native/test_combat_guest_qa.c'
      - 'native/test_enemies.c'
      - 'tests/test-flower-enemies.cjs'
      - 'native/test_flower.c'
      - 'tests/test-flower-source.cjs'
      - 'native/test_demo_step.c'
      - 'native/test_draw.c'
      - 'native/rikitu_loop.*'
      - 'native/rikitu_stage.*'
      - 'native/rikitu_surfaces.*'
      - 'switch_graphical/**'
      - 'tests/check_nro.py'
      - '.github/workflows/switch-graphics.yml'
  push:
    paths:
      - 'native/rikitu_draw.*'
      - 'native/rikitu_demo.*'
      - 'native/rikitu_flower.*'
      - 'native/rikitu_flower_data.h'
      - 'native/rikitu_flower_enemies_data.h'
      - 'native/rikitu_enemies.*'
      - 'native/rikitu_boss.*'
      - 'native/rikitu_mill.*'
      - 'native/rikitu_grove.*'
      - 'native/rikitu_bridge.*'
      - 'native/rikitu_bridge_guest_qa.*'
      - 'native/test_bridge_guest_qa.c'
      - 'native/rikitu_bridge_data.h'
      - 'native/test_bridge.c'
      - 'tests/test-bridge-source.cjs'
      - 'native/rikitu_grove_data.h'
      - 'native/test_grove.c'
      - 'native/rikitu_grove_guest_qa.*'
      - 'native/test_grove_guest_qa.c'
      - 'tests/test-grove-source.cjs'
      - 'native/test_mill_guest_qa.c'
      - 'native/rikitu_mill_data.h'
      - 'native/test_mill.c'
      - 'tests/test-mill-source.cjs'
      - 'native/rikitu_save.*'
      - 'native/rikitu_save_io.c'
      - 'native/test_save.c'
      - 'native/rikitu_combat_guest_qa.*'
      - 'native/test_combat_guest_qa.c'
      - 'native/test_enemies.c'
      - 'tests/test-flower-enemies.cjs'
      - 'native/test_flower.c'
      - 'tests/test-flower-source.cjs'
      - 'native/test_demo_step.c'
      - 'native/test_draw.c'
      - 'native/rikitu_loop.*'
      - 'native/rikitu_stage.*'
      - 'native/rikitu_surfaces.*'
      - 'switch_graphical/**'
      - '.github/workflows/switch-graphics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GCC portable renderer and deterministic preview
        run: |
          mkdir -p artifacts
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_draw.c native/rikitu_demo.c native/rikitu_boss.c native/rikitu_enemies.c native/test_draw.c -lm -o /tmp/rikitu-draw-gcc
          /tmp/rikitu-draw-gcc artifacts/rikitu-debug-scene.ppm
      - name: Clang portable renderer
        run: |
          clang -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_draw.c native/rikitu_demo.c native/rikitu_boss.c native/rikitu_enemies.c native/test_draw.c -lm -o /tmp/rikitu-draw-clang
          /tmp/rikitu-draw-clang
      - name: GCC measured time and per-tick gameplay regression
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_boss.c native/rikitu_enemies.c native/test_demo_step.c -lm -o /tmp/rikitu-measured-step-gcc
          /tmp/rikitu-measured-step-gcc
      - name: Clang measured time and per-tick gameplay regression
        run: |
          clang -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_boss.c native/rikitu_enemies.c native/test_demo_step.c -lm -o /tmp/rikitu-measured-step-clang
          /tmp/rikitu-measured-step-clang
      - name: Verify native Flower Trail data against actual game.js
        run: node tests/test-flower-source.cjs
      - name: GCC real level geometry and checkpoint tests
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_boss.c native/rikitu_flower.c native/rikitu_enemies.c native/test_flower.c -lm -o /tmp/rikitu-flower-gcc
          /tmp/rikitu-flower-gcc
      - name: Clang real level geometry and checkpoint tests
        run: |
          clang -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_boss.c native/rikitu_flower.c native/rikitu_enemies.c native/test_flower.c -lm -o /tmp/rikitu-flower-clang
          /tmp/rikitu-flower-clang
      - name: Browser-source parity for all six MAP01 enemies
        run: node tests/test-flower-enemies.cjs
      - name: GCC enemy patrol combat and respawn regression
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_boss.c native/rikitu_flower.c native/rikitu_enemies.c native/test_enemies.c -lm -o /tmp/rikitu-enemies-gcc
          /tmp/rikitu-enemies-gcc
      - name: Clang enemy patrol combat and respawn regression
        run: |
          clang -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_boss.c native/rikitu_flower.c native/rikitu_enemies.c native/test_enemies.c -lm -o /tmp/rikitu-enemies-clang
          /tmp/rikitu-enemies-clang
      - name: GCC execute same C99 combat tests as NeXium guest
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_boss.c native/rikitu_flower.c native/rikitu_enemies.c native/rikitu_combat_guest_qa.c native/test_combat_guest_qa.c -lm -o /tmp/rikitu-combat-guest-gcc
          /tmp/rikitu-combat-guest-gcc
      - name: Clang execute same C99 combat tests as NeXium guest
        run: |
          clang -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_boss.c native/rikitu_flower.c native/rikitu_enemies.c native/rikitu_combat_guest_qa.c native/test_combat_guest_qa.c -lm -o /tmp/rikitu-combat-guest-clang
          /tmp/rikitu-combat-guest-clang
      - name: GCC dual-slot checkpoint persistence tests
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_boss.c native/rikitu_flower.c native/rikitu_enemies.c native/rikitu_save.c native/rikitu_save_io.c native/test_save.c -lm -o /tmp/rikitu-save-gcc
          /tmp/rikitu-save-gcc
      - name: Clang dual-slot checkpoint persistence tests
        run: |
          clang -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_boss.c native/rikitu_flower.c native/rikitu_enemies.c native/rikitu_save.c native/rikitu_save_io.c native/test_save.c -lm -o /tmp/rikitu-save-clang
          /tmp/rikitu-save-clang
      - name: Browser MAP02 geometry and boss source parity
        run: node tests/test-mill-source.cjs
      - name: GCC MAP02 mini-boss and gate integration
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_boss.c native/rikitu_flower.c native/rikitu_mill.c native/rikitu_enemies.c native/test_mill.c -lm -o /tmp/rikitu-map02-gcc
          /tmp/rikitu-map02-gcc
      - name: Clang MAP02 mini-boss and gate integration
        run: |
          clang -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_boss.c native/rikitu_flower.c native/rikitu_mill.c native/rikitu_enemies.c native/test_mill.c -lm -o /tmp/rikitu-map02-clang
          /tmp/rikitu-map02-clang
      - name: GCC native MAP02 guest check parity
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_boss.c native/rikitu_enemies.c native/rikitu_mill.c native/rikitu_mill_guest_qa.c native/test_mill_guest_qa.c -lm -o /tmp/rikitu-mill-guest-gcc
          /tmp/rikitu-mill-guest-gcc
      - name: Clang native MAP02 guest check parity
        run: |
          clang -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_boss.c native/rikitu_enemies.c native/rikitu_mill.c native/rikitu_mill_guest_qa.c native/test_mill_guest_qa.c -lm -o /tmp/rikitu-mill-guest-clang
          /tmp/rikitu-mill-guest-clang
      - name: Browser-source parity for MAP03 Grove and mushrooms
        run: node tests/test-grove-source.cjs
      - name: GCC real mushroom springs and MAP03 exit
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_enemies.c native/rikitu_boss.c native/rikitu_grove.c native/test_grove.c -lm -o /tmp/rikitu-grove-gcc
          /tmp/rikitu-grove-gcc
      - name: Clang real mushroom springs and MAP03 exit
        run: |
          clang -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_enemies.c native/rikitu_boss.c native/rikitu_grove.c native/test_grove.c -lm -o /tmp/rikitu-grove-clang
          /tmp/rikitu-grove-clang
      - name: GCC execute MAP03 4 guest checks on host
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_boss.c native/rikitu_enemies.c native/rikitu_grove.c native/rikitu_grove_guest_qa.c native/test_grove_guest_qa.c -lm -o /tmp/rikitu-grove-guest-gcc
          /tmp/rikitu-grove-guest-gcc
      - name: Clang execute MAP03 4 guest checks on host
        run: |
          clang -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_boss.c native/rikitu_enemies.c native/rikitu_grove.c native/rikitu_grove_guest_qa.c native/test_grove_guest_qa.c -lm -o /tmp/rikitu-grove-guest-clang
          /tmp/rikitu-grove-guest-clang
      - name: Verify MAP04 against authoritative browser geometry
        run: node tests/test-bridge-source.cjs
      - name: GCC three bridge levers, boss and fragment-gated exit
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_enemies.c native/rikitu_boss.c native/rikitu_bridge.c native/test_bridge.c -lm -o /tmp/rikitu-bridge-gcc
          /tmp/rikitu-bridge-gcc
      - name: Clang three bridge levers, boss and fragment-gated exit
        run: |
          clang -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_enemies.c native/rikitu_boss.c native/rikitu_bridge.c native/test_bridge.c -lm -o /tmp/rikitu-bridge-clang
          /tmp/rikitu-bridge-clang
      - name: GCC MAP04 guest checks against live engine
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_boss.c native/rikitu_enemies.c native/rikitu_bridge.c native/rikitu_bridge_guest_qa.c native/test_bridge_guest_qa.c -lm -o /tmp/rikitu-bridge-guest-gcc
          /tmp/rikitu-bridge-guest-gcc
      - name: Clang MAP04 guest checks against live engine
        run: |
          clang -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_boss.c native/rikitu_enemies.c native/rikitu_bridge.c native/rikitu_bridge_guest_qa.c native/test_bridge_guest_qa.c -lm -o /tmp/rikitu-bridge-guest-clang
          /tmp/rikitu-bridge-guest-clang
      - name: Upload pixel-accurate host render
        uses: actions/upload-artifact@v4
        with:
          name: rikitu-debug-scene-preview-ppm
          path: artifacts/rikitu-debug-scene.ppm
          if-no-files-found: error
  switch-nro:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
      - name: Configure SDK
        run: |
          test -x "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-gcc"
          test -f "$DEVKITPRO/libnx/switch_rules"
          echo "$DEVKITPRO/devkitA64/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/tools/bin" >> "$GITHUB_PATH"
      - name: Build 1280x720 graphical NRO
        run: make -C switch_graphical -j2
      - name: Verify NRO0 header
        run: |
          test -s switch_graphical/rikitu_scene_probe.nro
          python3 tests/check_nro.py switch_graphical/rikitu_scene_probe.nro
      - name: Upload graphical NRO
        uses: actions/upload-artifact@v4
        with:
          name: rikitu-first-graphical-nro
          path: switch_graphical/rikitu_scene_probe.nro
          if-no-files-found: error
