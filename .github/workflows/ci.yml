name: Browser and game-rule checks
# Only the protected main branch needs a push run. Feature branches are
# tested by their pull_request event, avoiding duplicate queued builds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# PRs are keyed by number, and distinct event types cannot cancel each other.
# A new push to the same PR still supersedes its previous outdated PR CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/build_singlefile.py --check
      - run: python tests/test-nro-checker.py
      - run: node tests/test-bridge-source.cjs
      - run: node tests/test-grove-source.cjs
      - run: node tests/test-mill-source.cjs
      - run: node tests/test-flower-source.cjs
      - run: node tests/test-flower-enemies.cjs
      - run: node tests/test-core.cjs
      - run: python tests/test-browser.py
      - run: python tests/test-moki.py
      - run: python tests/test-autosave.py
      - run: python tests/test-world2.py
      - run: python tests/test-world2-finale.py
      - run: python tests/test-completion-results.py
      - run: python tests/test-mountains.py
      - run: python tests/test-world3-finale.py
      - run: python tests/test-castle.py
      - run: python tests/test-finale.py
      - run: python tests/test-real-controls.py
      - run: python tests/test-export-results.py
      - name: Save real-control frames for visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rikitu-real-controls-frames
          path: artifacts/real-controls/*.png
          if-no-files-found: warn
      - name: Native C99 rules (GCC)
        run: gcc -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/test_rules.c -o /tmp/rikitu-gcc && /tmp/rikitu-gcc
      - name: Native C99 rules (Clang)
        run: clang -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/test_rules.c -o /tmp/rikitu-clang && /tmp/rikitu-clang
      - name: Direct C99 vs JavaScript rules parity (GCC)
        run: gcc -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/parity_probe.c -o /tmp/rikitu-parity && node tests/test-native-parity.cjs /tmp/rikitu-parity
      - name: C99 fixed-step player loop (GCC)
        run: gcc -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/test_loop.c -o /tmp/rikitu-loop-gcc && /tmp/rikitu-loop-gcc
      - name: C99 fixed-step player loop (Clang)
        run: clang -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/test_loop.c -o /tmp/rikitu-loop-clang && /tmp/rikitu-loop-clang
      - name: Browser-source movement parity versus native C99 (GCC)
        run: gcc -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/motion_probe.c -o /tmp/rikitu-motion-gcc && node tests/test-motion-parity.cjs /tmp/rikitu-motion-gcc
      - name: Browser-source movement parity versus native C99 (Clang)
        run: clang -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/motion_probe.c -o /tmp/rikitu-motion-clang && node tests/test-motion-parity.cjs /tmp/rikitu-motion-clang
      - name: Native surface mechanics (GCC)
        run: gcc -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/test_surfaces.c -lm -o /tmp/rikitu-surfaces-gcc && /tmp/rikitu-surfaces-gcc
      - name: Native surface mechanics (Clang)
        run: clang -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/test_surfaces.c -lm -o /tmp/rikitu-surfaces-clang && /tmp/rikitu-surfaces-clang
      - name: Browser-source surface parity versus C99 (GCC)
        run: gcc -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/surfaces_probe.c -lm -o /tmp/rikitu-surfaces-parity-gcc && node tests/test-surfaces-parity.cjs /tmp/rikitu-surfaces-parity-gcc
      - name: Browser-source surface parity versus C99 (Clang)
        run: clang -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/surfaces_probe.c -lm -o /tmp/rikitu-surfaces-parity-clang && node tests/test-surfaces-parity.cjs /tmp/rikitu-surfaces-parity-clang
      - name: Native stage objectives (GCC)
        run: gcc -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_stage.c native/test_stage.c -lm -o /tmp/rikitu-stage-gcc && /tmp/rikitu-stage-gcc
      - name: Native stage objectives (Clang)
        run: clang -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_stage.c native/test_stage.c -lm -o /tmp/rikitu-stage-clang && /tmp/rikitu-stage-clang
      - name: GCC MAP09 gust input and RKL3 checkpoint recovery
        run: gcc -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_enemies.c native/rikitu_boss.c native/rikitu_campaign.c native/rikitu_level_save.c native/rikitu_level_save_io.c native/rikitu_mist.c native/test_mist_controller_resume.c -lm -o /tmp/rikitu-stage80-gcc && /tmp/rikitu-stage80-gcc
      - name: Clang MAP09 gust input and RKL3 checkpoint recovery
        run: clang -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_enemies.c native/rikitu_boss.c native/rikitu_campaign.c native/rikitu_level_save.c native/rikitu_level_save_io.c native/rikitu_mist.c native/test_mist_controller_resume.c -lm -o /tmp/rikitu-stage80-clang && /tmp/rikitu-stage80-clang
