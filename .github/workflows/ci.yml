      - name: GCC MAP11 full input route, patrols, springs and exit
        run: gcc -std=c99 -Wall -Wextra -Werror -pedantic -Inative native/rikitu_rules.c native/rikitu_loop.c native/rikitu_surfaces.c native/rikitu_stage.c native/rikitu_demo.c native/rikitu_enemies.c native/rikitu_boss.c native/rikitu_crystal.c native/test_crystal_full_route.c -lm -o /tmp/rikitu-stage83-gcc && /tmp/rikitu-stage83-gcc
